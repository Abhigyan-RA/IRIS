name: CI

on:
  push:
    branches: [main]
  pull_request:

# Continuous integration.
#
# The build fails on a failing or skipped test, a lint or type error, unformatted
# code, coverage below the threshold, or a high-severity dependency advisory.
jobs:
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Tests with coverage gate
        run: python -m pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests with coverage gate
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  end-to-end:
    name: End-to-end journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run the analyst journey
        run: npm run test:e2e --workspace @shadow-cpi/web

  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: No-emoji check
        run: python backend/src/shadow_cpi/tooling/no_emoji.py
